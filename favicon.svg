<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- White background -->
  <rect width="512" height="512" fill="#ffffff"/>
  
  <!-- Border -->
  <rect x="20" y="20" width="472" height="472" fill="none" stroke="url(#grad)" stroke-width="12" rx="40"/>
  
  <!-- Letter A -->
  <text x="256" y="380" font-family="Arial, sans-serif" font-size="320" font-weight="bold" text-anchor="middle" fill="url(#grad)">A</text>
</svg>
